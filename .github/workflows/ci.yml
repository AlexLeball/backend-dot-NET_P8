name: CI Pipeline

on:
  push:
    branches: [ master, main, "develop", "update/**" ]
  pull_request:
    branches: [ master, main, "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~PerformanceTest"

      - name: Publish artifacts
        run: dotnet publish Api/ --configuration Release --no-build --output ./publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tourguide-api
          path: ./publish
